name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python experiments/gate0_local_next_state.py
      - run: python experiments/gate1_illegal_predictor.py
      - run: python experiments/gate2_delayed_relevance.py
      - run: python experiments/gate3_temporal_context_reinstatement.py
      - run: python experiments/gate4_learn_what_to_remember.py
      - run: python experiments/gate5_policy_blindness_under_drift.py
      - run: python -m unittest discover -s tests -v
